<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>Nectar — social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Rendered at exactly 1200 x 630 and saved as /og-image.png:
       msedge --headless=new --window-size=1200,630 --screenshot=og-image.png docs/og-card.html
     Change the copy here, re-render, and the link preview follows. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #08080a;
    color: #f3ebe0;
    font-family: "Instrument Sans", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glow {
    position: absolute;
    inset: -260px -120px auto -120px;
    height: 620px;
    background: radial-gradient(60% 60% at 50% 50%, rgba(247, 154, 99, 0.34), rgba(247, 154, 99, 0) 70%);
  }
  .card {
    position: relative;
    height: 100%;
    padding: 64px 76px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 44px; height: 44px; border-radius: 12px; }
  .brand span {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    letter-spacing: 0.22em;
    color: #efe6d9;
  }
  .ver {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: #f79a63;
    border: 1px solid rgba(247, 154, 99, 0.45);
    border-radius: 999px;
    padding: 3px 9px;
  }
  h1 {
    margin: 42px 0 0;
    font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
    font-size: 78px;
    line-height: 0.97;
    letter-spacing: -0.025em;
    font-weight: 600;
    max-width: 940px;
  }
  h1 em { font-style: italic; color: #f79a63; font-weight: 500; }
  p {
    margin: 26px 0 0;
    max-width: 820px;
    font-size: 22px;
    line-height: 1.4;
    color: #b6afa2;
  }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 10px; }
  .chip {
    border-radius: 11px;
    padding: 9px 15px;
    font-size: 14px;
    font-weight: 600;
    color: #12251a;
  }
  .mint { background: #8dba98; }
  .lilac { background: #a39cd0; }
  .butter { background: #d2ca72; }
  .sky { background: #8cb1cd; }
  .host {
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.08em;
    color: #6f6a61;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="card">
    <div class="brand">
      <img src="../Nectar/Assets/nectar-mark.scale-400.png" alt="" />
      <span>NECTAR</span>
      <span class="ver">v2</span>
    </div>

    <div>
      <h1>The notch that<br /><em>holds your day.</em></h1>
      <p>Tasks, a focus timer, a scratchpad and today's calendar — a local-first Windows overlay that never steals focus from the app you are in.</p>
    </div>

    <div class="foot">
      <div class="chips">
        <span class="chip mint">Tasks</span>
        <span class="chip lilac">Focus</span>
        <span class="chip butter">Notepad</span>
        <span class="chip sky">Events</span>
      </div>
      <span class="host">ALT + N · WINDOWS 10 &amp; 11</span>
    </div>
  </div>
</body>
</html>
